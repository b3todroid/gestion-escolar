# Gestión Escolar — VERIFICACIÓN continua (Fase 12). INACTIVO a propósito:
# para activarlo, una persona autorizada lo copia a .github/workflows/verificacion.yml.
# Sólo valida (tipos, pruebas, compilación, imágenes). NO despliega, NO publica imágenes y NO tiene
# acceso a secretos ni a servidores: el despliegue se hace con deploy/scripts/desplegar.sh y aprobación.
name: verificacion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aplicacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23', cache: npm }
      - run: npm ci
      - run: npm run check            # tipos + unitarias + compilación
      - run: npm audit --omit=dev     # 0 vulnerabilidades en producción
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test      # funcionales con Service Worker

  servidor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: solo-ci, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 20
    env:
      PRUEBAS_POSTGRES_URL: postgres://ci:solo-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23', cache: npm }
      - run: npm ci
      - run: npm run test:servidor
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:servidor

  imagenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target servidor -t gestion-escolar/servidor:ci .
      - run: docker build -f deploy/Dockerfile --target web -t gestion-escolar/web:ci .
      - name: Configuración de Compose válida (con valores de ejemplo, sin secretos)
        run: |
          cp deploy/preproduccion.env.example deploy/preproduccion.env
          mkdir -p deploy/secretos && for s in pg_superusuario pg_gestion database_url better_auth_secret smtp_clave; do echo ci > deploy/secretos/$s; done
          docker compose -f deploy/docker-compose.yml -f deploy/compose.preproduccion.yml --env-file deploy/preproduccion.env config --quiet
